services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate --workspace=backend && npm run build:backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/v1/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: MAINTENANCE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false
      - key: LOG_LEVEL
        value: info
