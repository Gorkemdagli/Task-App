map $http_x_forwarded_for $taskflow_client_ip {
    default $remote_addr;
    ~(?<last_ip>[^,[:space:]]+)$ $last_ip;
}

map $request_uri $taskflow_auth_route {
    default 0;
    ~^/api/v1/auth/(login|register|refresh|logout)$ 1;
}

map "$status:$uri" $taskflow_cache_control {
    default no-store;
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
}

map $uri $taskflow_referrer_policy {
    default strict-origin-when-cross-origin;
    ~*^/api/v1/storage/private/?$ no-referrer;
}

map $http_upgrade $taskflow_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 26m;

    add_header Cache-Control $taskflow_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.fontshare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self';" always;
    add_header Referrer-Policy $taskflow_referrer_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $taskflow_api http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $taskflow_client_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_hide_header Cache-Control;

    location ~* ^/api/v1/auth(/|$) {
        if ($request_uri ~ "[?]") { return 400; }
        if ($taskflow_auth_route = 0) { return 404; }
        if ($request_method != POST) { return 405; }

        client_max_body_size 64k;
        client_body_timeout 8s;
        proxy_connect_timeout 8s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
        proxy_buffering off;
        proxy_pass $taskflow_api;
    }

    location ^~ /api/v1/storage/private {
        access_log off;
        error_log /dev/null crit;
        proxy_pass $taskflow_api;
    }

    location = /api/v1/realtime/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $taskflow_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $taskflow_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_pass $taskflow_api;
    }

    location ~* ^/api(/|$) {
        proxy_pass $taskflow_api;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~ /[^/]+\.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
